<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;font:16px system-ui}main{padding:8px}textarea{width:100%;min-height:240px;box-sizing:border-box;padding:12px;font:inherit;resize:vertical}button{font:inherit;padding:8px;margin-top:8px}small{display:block;margin-top:5px}</style></head><body><main><label for="texto">Escribe aquí tu historia</label><textarea id="texto" placeholder="Había una vez…"></textarea><small id="estado" role="status">El texto se guarda en este navegador cuando es posible.</small><button id="guardar">Descargar TXT</button><button id="enviar">Enviar por correo</button><button id="borrar">Borrar texto</button></main><script>const t=document.getElementById('texto');try{t.value=localStorage.getItem('indesign-texto-v1')||''}catch(e){}t.addEventListener('input',()=>{try{localStorage.setItem('indesign-texto-v1',t.value)}catch(e){document.getElementById('estado').textContent='No se puede guardar automáticamente aquí; usa Descargar TXT.'}});document.getElementById('guardar').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([t.value],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='mi-texto.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('enviar').onclick=()=>{if(!t.value.trim()){alert('Escribe algo antes de enviarlo.');return}const asunto=encodeURIComponent('Actividad del libro - texto');const cuerpo=encodeURIComponent(t.value);location.href='mailto:angelabarrera@usantotomas.edu.co?subject='+asunto+'&body='+cuerpo};document.getElementById('borrar').onclick=()=>{if(confirm('¿Borrar todo el texto?')){t.value='';t.dispatchEvent(new Event('input'))}};</script></body></html>
