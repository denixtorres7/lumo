(function(){'use strict';const dog=document.getElementById('lumo');let down=false,dx=0,dy=0;const KEY='lumo-pos-v1';
function put(x,y){const maxX=Math.max(0,innerWidth-dog.offsetWidth),maxY=Math.max(0,innerHeight-dog.offsetHeight);x=Math.max(0,Math.min(maxX,x));y=Math.max(0,Math.min(maxY,y));dog.style.left=x+'px';dog.style.top=y+'px';try{localStorage.setItem(KEY,JSON.stringify({x:x/Math.max(1,maxX),y:y/Math.max(1,maxY)}))}catch(e){}}
function restore(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)){put(p.x*Math.max(0,innerWidth-dog.offsetWidth),p.y*Math.max(0,innerHeight-dog.offsetHeight));return}}catch(e){}put(innerWidth*.293,innerHeight*.035)}
dog.addEventListener('pointerdown',e=>{down=true;const r=dog.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;dog.setPointerCapture(e.pointerId);e.preventDefault()});
dog.addEventListener('pointermove',e=>{if(down)put(e.clientX-dx,e.clientY-dy)});dog.addEventListener('pointerup',()=>down=false);dog.addEventListener('pointercancel',()=>down=false);
dog.addEventListener('keydown',e=>{const d={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(d){e.preventDefault();put(dog.offsetLeft+d[0],dog.offsetTop+d[1])}});
addEventListener('resize',restore);dog.addEventListener('load',restore);restore();})();
