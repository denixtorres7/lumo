<script>(()=>{
 const img=document.getElementById('tarjeta');
 const key='tullave-tamano-v1';
 let w=Math.min(innerWidth*.7,420);
 try { const saved=Number(localStorage.getItem(key)); if(Number.isFinite(saved)&&saved>0)w=saved; } catch(e){}
 function aplicar(){
   w=Math.max(80,Math.min(w,Math.max(100,innerWidth-12)));
   const r=img.getBoundingClientRect();
   img.style.width=w+'px';
   if(img.style.transform==='none'){
     img.style.left=Math.max(0,Math.min(innerWidth-img.offsetWidth,r.left))+'px';
     img.style.top=Math.max(0,Math.min(innerHeight-img.offsetHeight,r.top))+'px';
   }
   try{localStorage.setItem(key,String(w))}catch(e){}
 }
 document.getElementById('agrandar').addEventListener('click',()=>{w+=40;aplicar()});
 document.getElementById('reducir').addEventListener('click',()=>{w-=40;aplicar()});
 addEventListener('load',aplicar);
})();</script></body></html>
