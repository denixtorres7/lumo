<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;font:16px system-ui}main{padding:8px}canvas{display:block;width:100%;height:280px;box-sizing:border-box;border:1px solid #777;background:#fff;touch-action:none}button,input{font:inherit;margin:4px}button{padding:6px}</style></head><body><main><label>Color <input id="color" type="color" value="#222222"></label><label>Grosor <input id="grosor" type="range" min="1" max="25" value="4"></label><button id="limpiar">Borrar</button><button id="guardar">Guardar PNG</button><canvas id="lienzo" aria-label="Área para dibujar con el dedo o el mouse"></canvas></main><script>const c=document.getElementById('lienzo'),ctx=c.getContext('2d'),color=document.getElementById('color'),grosor=document.getElementById('grosor');let pintando=false;function ajustar(){const anterior=document.createElement('canvas');anterior.width=c.width;anterior.height=c.height;anterior.getContext('2d').drawImage(c,0,0);const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);if(anterior.width)ctx.drawImage(anterior,0,0,anterior.width,anterior.height,0,0,r.width,r.height)}ajustar();addEventListener('resize',ajustar);function xy(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}c.addEventListener('pointerdown',e=>{pintando=true;c.setPointerCapture(e.pointerId);const [x,y]=xy(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()});c.addEventListener('pointermove',e=>{if(!pintando)return;const [x,y]=xy(e);ctx.strokeStyle=color.value;ctx.lineWidth=+grosor.value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(x,y);ctx.stroke();e.preventDefault()});['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>pintando=false));document.getElementById('limpiar').onclick=()=>ctx.clearRect(0,0,c.width,c.height);document.getElementById('guardar').onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='mi-dibujo.png';a.click()};</script><p><button id="enviar">Enviar por correo</button></p><p id="aviso" role="status" style="font-size:13px">Primero descarga tu dibujo; después adjunta el archivo al correo.</p><script>document.getElementById("enviar").onclick=()=>{location.href="mailto:angelabarrera@usantotomas.edu.co?subject="+encodeURIComponent("Actividad del libro - dibujo")+"&body="+encodeURIComponent("Hola, adjunto mi dibujo realizado en el libro interactivo. Recuerda adjuntar el archivo descargado antes de enviar.");};</script></body></html>
