<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:12px;background:transparent}button,a{font:inherit;margin:4px;padding:8px}audio{max-width:100%;display:block;margin:12px 0}#estado{min-height:1.5em}</style></head><body><div><button id="iniciar">● Grabar</button><button id="detener" disabled>■ Detener</button></div><p id="estado" role="status">Listo para grabar</p><audio id="reproducir" controls></audio><a id="descargar" hidden>Descargar audio</a><script>let grabador,flujo,partes=[],url;const ini=document.getElementById('iniciar'),fin=document.getElementById('detener'),estado=document.getElementById('estado'),audio=document.getElementById('reproducir'),descarga=document.getElementById('descargar');ini.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Este navegador no permite grabar audio aquí.');flujo=await navigator.mediaDevices.getUserMedia({audio:true});partes=[];grabador=new MediaRecorder(flujo);grabador.ondataavailable=e=>{if(e.data.size)partes.push(e.data)};grabador.onstop=()=>{const blob=new Blob(partes,{type:grabador.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;descarga.href=url;descarga.download='mi-audio.'+(blob.type.includes('mp4')?'m4a':'webm');descarga.hidden=false;flujo.getTracks().forEach(t=>t.stop());estado.textContent='Grabación terminada';ini.disabled=false;fin.disabled=true};grabador.start();ini.disabled=true;fin.disabled=false;descarga.hidden=true;estado.textContent='Grabando…'}catch(e){estado.textContent='No se pudo grabar: '+e.message;ini.disabled=false}};fin.onclick=()=>{if(grabador?.state==='recording')grabador.stop()};</script><p><button id="enviar">Enviar por correo</button></p><p id="aviso" role="status" style="font-size:13px">Primero descarga tu grabación; después adjunta el archivo al correo.</p><script>document.getElementById("enviar").onclick=()=>{if(!descarga.href||descarga.hidden){alert('Graba y descarga el audio primero.');return;}location.href="mailto:angelabarrera@usantotomas.edu.co?subject="+encodeURIComponent("Actividad del libro - audio")+"&body="+encodeURIComponent("Hola, adjunto mi grabación de audio realizado en el libro interactivo. Recuerda adjuntar el archivo descargado antes de enviar.");};</script></body></html>
